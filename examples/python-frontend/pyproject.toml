[project]
name = "srl-tui"
version = "0.1.0"
description = "A terminal frontend for srl, with Rich"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13"]

[project.scripts]
srl-tui = "srl_tui:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
