<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- public/favicon.svg as a maskable icon: its background fills the whole
       square, and the card on its stack is shrunk into the middle, inside
       the circle a phone may cut the icon down to. Made into PNGs as said
       in README.md, "Installing it as an app". -->
  <rect width="32" height="32" fill="#1c1917"/>
  <g transform="translate(16 16) scale(0.72) translate(-16 -16)">
    <rect x="8" y="5" width="19" height="15" rx="2.5" fill="#78716c" transform="rotate(8 17.5 12.5)"/>
    <rect x="5" y="11" width="21" height="16" rx="2.5" fill="#f5f5f4"/>
    <rect x="8.5" y="15" width="14" height="2.5" rx="1.25" fill="#a8a29e"/>
    <rect x="8.5" y="20.5" width="9" height="3" rx="1.5" fill="#fbbf24"/>
  </g>
</svg>
