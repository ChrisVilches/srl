[workspace]
resolver = "3"
members = ["crates/srl", "crates/srl-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
srl-core = { path = "crates/srl-core" }
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fsrs = "6.6.2"
getrandom = "0.4.3"
globset = { version = "0.4.20", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "cache"] }
saphyr = { version = "0.2.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
unicode-normalization = { version = "0.1.26", default-features = false, features = ["std"] }
which = "8.0.6"

# Lint policy: see docs/rust.md, "Linting".
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
# Groups
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that cost more than they give in this codebase
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Selected restriction lints
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
exit = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mod_module_files = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
string_slice = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
